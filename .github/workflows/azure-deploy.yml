name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install and Build frontend only
        run: |
          npm install
          npm run build
          rm -rf node_modules

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'hili-assetmanager'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
