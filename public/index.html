<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hili Asset Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--scroll-tr)}
::-webkit-scrollbar-thumb{background:var(--scroll-th);border-radius:3px}
/* ── theme vars ── */
[data-theme="black"]{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#212438;
  --border:#2a2f45;--border2:#3d4468;
  --text:#eef1fa;--text-sub:#a8b4d0;--text-muted:#6a7899;
  --hover:#252840;--input-bg:#141622;--select-bg:#1a1d2e;
  --link:#7eb8ff;--tab-on:#252840;--accent:#5b7cfa;
  --scroll-tr:#1a1d2e;--scroll-th:#3d4468;
  --row-alt:#212438;
}
[data-theme="light"]{
  --bg:#1e2a3f;--surface:#263350;--surface2:#1e2a3f;
  --border:#3f5580;--border2:#5a7ab0;
  --text:#e4eaf8;--text-sub:#9ab0d8;--text-muted:#607098;
  --hover:#2d3e5e;--input-bg:#1e2a3f;--select-bg:#263350;
  --link:#89b8ff;--tab-on:#2d3e5e;--accent:#5b7cfa;
  --scroll-tr:#263350;--scroll-th:#5a7ab0;
}
[data-theme="light"]{
  --bg:#f5f7fa;--surface:#ffffff;--surface2:#f0f2f7;
  --border:#e2e6ed;--border2:#c5ccd8;
  --text:#1a1d23;--text-sub:#4a5568;--text-muted:#8a97a8;
  --hover:#edf0f7;--input-bg:#ffffff;--select-bg:#ffffff;
  --link:#2563eb;--tab-on:#e8ecf8;--accent:#2563eb;
  --scroll-tr:#f0f2f7;--scroll-th:#c5ccd8;
  --row-alt:#f8f9fc;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;min-height:100vh;font-size:13px}
input,select,textarea{outline:none;transition:border .15s,background .2s,color .2s;font-family:inherit}
/* ── buttons ── */
.btn{cursor:pointer;border:none;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;padding:8px 16px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#238636;color:#fff}.btn-primary:hover{background:#2ea043}
.btn-danger{background:#da3633;color:#fff}.btn-danger:hover{background:#f85149}
.btn-ghost{background:transparent;color:var(--text-sub);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-accent{background:#1f6feb;color:#fff}.btn-accent:hover{background:#388bfd}
.btn-purple{background:#6e40c9;color:#fff}.btn-purple:hover{background:#8957e5}
.btn-yellow{background:#d29922;color:#fff}.btn-yellow:hover{background:#e3b341}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ── form fields ── */
.fi{display:flex;flex-direction:column;gap:6px}
.fl{font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.fi2{background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;width:100%}
.fi2:focus{border-color:#388bfd}
.fi2::placeholder{color:var(--text-muted)}
select.fi2 option{background:var(--select-bg);color:var(--text)}
textarea.fi2{resize:vertical}
/* ── layout ── */
#app{display:flex;flex-direction:column;min-height:100vh}
#header{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:100}
#content{padding:16px 24px 48px;flex:1;max-width:1400px;margin:0 auto;width:100%}
/* ── nav tabs ── */
.ntab{cursor:pointer;padding:8px 16px;border-radius:6px;font-size:13px;color:var(--text-sub);border:none;background:transparent;font-family:'JetBrains Mono',monospace;white-space:nowrap;transition:all .15s}
.ntab:hover{color:var(--text);background:var(--tab-on)}
.ntab.on{color:var(--text);background:var(--tab-on);border-bottom:2px solid #1f6feb}
/* ── table ── */
.card{background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:7px 10px;text-align:left;color:var(--text-sub);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;position:relative;user-select:none;cursor:pointer}
th:hover{color:var(--link)}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border2)}
tbody tr:hover{background:var(--hover)}
tbody tr:nth-child(even){background:var(--row-alt,var(--surface2))}
tbody tr:nth-child(even):hover{background:var(--hover)}
td{padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;font-size:12px}
.tfoot{padding:8px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
/* ── misc ── */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--text-sub)}
.sep{border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:16px;font-size:12px;color:var(--text-sub);font-weight:600}
.ai{animation:si .2s ease}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* ── modal overlay ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:28px;width:420px;max-width:96vw;max-height:88vh;overflow-y:auto}
/* ── toast ── */
#toast{position:fixed;top:20px;right:20px;z-index:999;border-radius:8px;padding:12px 20px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px;display:none;animation:si .2s ease}
/* ── login screen ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:40px;width:380px;max-width:96vw}
/* ── drop zone ── */
.dz{border:2px dashed var(--border2);border-radius:10px;padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.dz:hover{border-color:#1f6feb;background:#1f6feb0a}
/* ── checkbox ── */
.cbx{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.cbx.checked{border-color:#22c55e;background:#22c55e}
/* ── col manager chip ── */
.col-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;user-select:none;font-size:13px}
.col-chip.on{background:var(--surface2);border-color:var(--border)}
.col-chip.off{background:var(--bg);border-color:var(--border2);opacity:.7}
.col-chip.drag-over{border-color:#1f6feb;background:#1f6feb22}
/* ── resize handle ── */
.rh-handle{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:2}
.rh-handle:hover::after,.rh-handle:active::after{content:'';display:block;width:2px;height:60%;background:var(--border2);margin:auto;border-radius:1px}
/* ── detail grid ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.detail-kv{margin-bottom:12px}
.detail-k{font-size:12px;color:var(--text-sub);font-weight:500;margin-bottom:4px}
.detail-v{font-size:14px;color:var(--text);word-break:break-all}
.detail-v.empty{color:var(--text-muted)}
</style>
</head>
<body data-theme="light">

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:28px">
      <img id="login-logo" src="" alt="Hili" style="height:72px;object-fit:contain;margin-bottom:12px;display:block;margin-inline:auto"/>
      <div style="font-size:20px;font-weight:700;color:var(--text)">Asset Manager</div>
      <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Accedi per continuare</div>
    </div>
    <div id="login-err" style="display:none;background:#da363322;border:1px solid #da363344;border-radius:8px;padding:10px 14px;font-size:13px;color:#f85149;margin-bottom:16px"></div>
    <div class="fi" style="margin-bottom:14px">
      <label class="fl">Username</label>
      <input class="fi2" id="lu" type="text" placeholder="Username" autocomplete="username"/>
    </div>
    <div class="fi" style="margin-bottom:20px">
      <label class="fl">Password</label>
      <input class="fi2" id="lp" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;font-size:14px;padding:11px" onclick="doLogin()">Accedi</button>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:12px;color:var(--text-muted)">oppure</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <a href="/auth/google" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;background:#fff;border:1px solid #ddd;border-radius:6px;font-size:14px;font-weight:500;color:#444;text-decoration:none;cursor:pointer;transition:background .15s" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='#fff'">

      Accedi con Google
    </a>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODALS -->
<div id="modal-delete" class="overlay" style="display:none">
  <div class="modal" style="text-align:center">
    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
    <div style="font-weight:600;font-size:15px;margin-bottom:8px">Eliminare questo asset?</div>
    <div style="color:var(--text-sub);font-size:13px;margin-bottom:24px">L'operazione verrà registrata nello storico.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" onclick="closeModal('modal-delete')">Annulla</button>
      <button class="btn btn-danger" id="modal-delete-confirm">Elimina</button>
    </div>
  </div>
</div>

<div id="modal-delete-hw" class="overlay" style="display:none">
  <div class="modal" style="text-align:center">
    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
    <div style="font-weight:600;font-size:15px;margin-bottom:8px">Eliminare questo hardware?</div>
    <div style="color:var(--text-sub);font-size:13px;margin-bottom:24px">Operazione non reversibile.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" onclick="closeModal('modal-delete-hw')">Annulla</button>
      <button class="btn btn-danger" id="modal-delete-hw-confirm">Elimina</button>
    </div>
  </div>
</div>

<div id="modal-reparti" class="overlay" style="display:none" onclick="if(event.target===this)closeModal('modal-reparti')">
  <div class="modal" style="width:460px">
    <div style="display:flex;align-items:center;margin-bottom:20px">
      <div style="font-weight:600;font-size:16px">⚙ Gestisci Ruoli</div>
      <div style="flex:1"></div>
      <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="closeModal('modal-reparti')">✕</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <input class="fi2" id="new-reparto-modal" placeholder="Nome nuovo ruolo..." style="flex:1" onkeydown="if(event.key==='Enter')addRepartoFromModal()"/>
      <button class="btn btn-primary" style="padding:5px 12px;font-size:12px" onclick="addRepartoFromModal()">+ Aggiungi</button>
    </div>
    <div id="reparti-list-modal"></div>
  </div>
</div>

<div id="modal-delete-user" class="overlay" style="display:none">
  <div class="modal" style="text-align:center">
    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
    <div style="font-weight:600;font-size:15px;margin-bottom:8px">Eliminare questo utente?</div>
    <div style="color:var(--text-sub);font-size:13px;margin-bottom:24px">Operazione non reversibile.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" onclick="closeModal('modal-delete-user')">Annulla</button>
      <button class="btn btn-danger" id="modal-delete-user-confirm">Elimina</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <div id="header">
    <img id="header-logo" src="" alt="Hili" style="height:58px;object-fit:contain"/>
    <div style="display:flex;gap:2px;margin-left:16px">
      <button class="ntab on" data-view="table"   onclick="switchView('table')">📦 Asset</button>
      <button class="ntab"     data-view="hardware" onclick="switchView('hardware')">🖥 Hardware</button>
      <button class="ntab"     data-view="history"  onclick="switchView('history')">🕓 Storico</button>
      <button class="ntab"     data-view="import"   onclick="switchView('import')">⬆ Importa</button>
      <button class="ntab"     data-view="users"    onclick="switchView('users')" id="tab-users" style="display:none">👥 Utenti</button>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;gap:14px;font-size:12px;color:var(--text-sub)" id="header-stats"></div>
    <div style="display:flex;gap:2px;background:var(--surface2);border-radius:12px;padding:3px;border:1px solid var(--border)">
      <button onclick="setTheme('black')" id="th-black" style="background:transparent;border:none;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--text-muted);transition:all .15s">⬛</button>
      <button onclick="setTheme('dark')"  id="th-dark"  style="background:var(--accent);border:none;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;color:#fff;transition:all .15s">🌙</button>
      <button onclick="setTheme('light')" id="th-light" style="background:transparent;border:none;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--text-muted);transition:all .15s">☀️</button>
    </div>
    <button class="btn btn-primary" onclick="openNewAsset()">+ Nuovo Asset</button>
    <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="doLogout()" title="Esci">⏏</button>
  </div>
  <div id="content" class="ai"></div>
</div>

function showToast(msg, type='success') {

  el.style.background = type==='error'?'#da3633':type==='info'?'#1f6feb':'#238636';

}

// ════════════════════════════════════════════════
// API HELPERS
// ════════════════════════════════════════════════
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showLogin(); return null; }
  if (!res.ok) {
    const err = await res.json().catch(()=>({error:'Errore server'}));
    throw new Error(err.error || 'Errore server');
  }
  return res.json();
}
const GET    = path        => api('GET',    path);
const POST   = (path, b)   => api('POST',   path, b);
const PUT    = (path, b)   => api('PUT',    path, b);
const DELETE = (path, b)   => api('DELETE', path, b);

// ════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════
async function checkAuth() {
  try {
    const me = await GET('/api/me');
    if (me?.ok) { showApp(); await loadAll(); }
    else showLogin();
  } catch { showLogin(); }
}
function showLogin() {
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}
function showApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
}
async function doLogin() {
  const u = document.getElementById('lu').value;
  const p = document.getElementById('lp').value;
  const err = document.getElementById('login-err');
  if (!u || !p) {
    err.textContent = 'Inserisci username e password';
    err.style.display = 'block';
    return;
  }
  try {
    const res = await POST('/api/login', {username:u, password:p});
    if (res?.ok) { err.style.display='none'; showApp(); await loadAll(); }
    else {
      err.textContent = 'Credenziali non valide';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Username o password errati';
    err.style.display = 'block';
  }
}
async function doLogout() {
  await POST('/api/logout');
  showLogin();
}
document.getElementById('lp').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ════════════════════════════════════════════════
// LOAD
// ════════════════════════════════════════════════
async function loadAll() {
  try {
    const [a,h,hi,r,c,l,me] = await Promise.all([
      GET('/api/assets'),
      GET('/api/hardware'),
      GET('/api/history'),
      GET('/api/reparti'),
      GET('/api/checks'),
      GET('/api/check-labels'),
      GET('/api/me'),
    ]);
    STATE.assets   = a  || [];
    STATE.hardware = h  || [];
    STATE.history  = hi || [];
    STATE.reparti  = (r||[]).map(x=>x.nome).filter(Boolean);
    if (!STATE.reparti.length) STATE.reparti = [...DEFAULT_REPARTI];
    const chMap = {};
    (c||[]).forEach(x => { chMap[x.key] = !!x.value; });
    STATE.checks = chMap;
    const lbs = (l||[]).sort((a,b)=>a.idx-b.idx);
    if (lbs.length===4) STATE.checkLabels = lbs.map(x=>x.label);
    STATE.currentUser = me || {};
    // Show users tab only for admin
    const usersTab = document.getElementById('tab-users');
    if (usersTab) usersTab.style.display = STATE.currentUser?.ruolo==='admin' ? '' : 'none';
    // Load users if admin
    if (STATE.currentUser?.ruolo==='admin') {
      const u = await GET('/api/users');
      STATE.users = u || [];
    }
    render();
  } catch(e) { showToast('Errore caricamento: '+e.message,'error'); }
}

// ════════════════════════════════════════════════
// THEME
// ════════════════════════════════════════════════
function setTheme(t) {
  STATE.theme = t;
  document.body.setAttribute('data-theme', t);
  ['black','dark','light'].forEach(x => {
    const btn = document.getElementById('th-'+x);
    if (!btn) return;
    if (x===t) { btn.style.background='var(--accent)'; btn.style.color='#fff'; }
    else        { btn.style.background='transparent';   btn.style.color='var(--text-muted)'; }
  });
  // logo filter
  const logo = document.getElementById('header-logo');
  if (logo) logo.style.filter = t==='light' ? 'brightness(0) saturate(0)' : 'none';
}

function switchView(v) {
  STATE.view = v;
  document.querySelectorAll('.ntab').forEach(b => {
    b.classList.toggle('on', b.dataset.view===v);
  });
  render();
}

// ════════════════════════════════════════════════
function render() {
  updateHeaderStats();
  const content = document.getElementById('content');
  content.className = 'ai';
  void content.offsetWidth; // retrigger animation
  content.className = 'ai';
  switch(STATE.view) {
    case 'table':    renderTable(content); break;
    case 'form':     renderForm(content);  break;
    case 'detail':   renderDetail(content);break;
    case 'hardware': renderHardware(content);break;
    case 'history':  renderHistory(content);break;
    case 'import':   renderImport(content); break;
    case 'users':    renderUsers(content);  break;
  }
}
function updateHeaderStats() {
  const el = document.getElementById('header-stats');
  if (!el) return;
  const total = STATE.assets.length;
  const active= STATE.assets.filter(a=>a.stato==='Attivo').length;
  el.innerHTML = `<span>📦 <b style="color:var(--text)">${total}</b> totali</span><span>✅ <b style="color:#22c55e">${active}</b> attivi</span>`;
}

// ════════════════════════════════════════════════
// FILTERING / SORTING
// ════════════════════════════════════════════════
function getFiltered() {
  let d = [...STATE.assets];
  if (STATE.search) {
    const q = STATE.search.toLowerCase();
    d = d.filter(a => ['nominativo','serialePC','numeroCellulare','accountMicrosoft','email','modelloPC'].some(k=>(a[k]||'').toLowerCase().includes(q)));
  }
  if (STATE.filterReparto!=='Tutti') d = d.filter(a=>a.reparto===STATE.filterReparto);
  if (STATE.filterStato  !=='Tutti') d = d.filter(a=>a.stato  ===STATE.filterStato);
  const f=STATE.sortField, dir=STATE.sortDir;
  d.sort((a,b)=>{ const va=(a[f]||'').toLowerCase(), vb=(b[f]||'').toLowerCase(); return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va); });
  return d;
}
function getHwFiltered() {
  let d = [...STATE.hardware];
  if (STATE.hwSearch) { const q=STATE.hwSearch.toLowerCase(); d=d.filter(h=>Object.values(h).some(v=>String(v).toLowerCase().includes(q))); }
  const f=STATE.hwSortField, dir=STATE.hwSortDir;
  d.sort((a,b)=>{ const va=String(a[f]||'').toLowerCase(), vb=String(b[f]||'').toLowerCase(); return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va); });
  return d;
}

function renderTable(el) {

        <div style="font-weight:600;font-size:14px">⚙ Gestisci colonne</div><div style="flex:1"></div>
        <span style="font-size:12px;color:var(--text-sub);margin-right:12px">Trascina per riordinare · Spunta per mostrare/nascondere</span>
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;margin-right:6px" onclick="resetCols()">Ripristina</button>
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="STATE.showColManager=false;render()">✕</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${STATE.colOrder.map(key => renderColChip(key)).join('')}
      </div>

  }

  // table headers
  const theadCols = activeCols.map(col => {
    const w = STATE.colWidths[col.key] ? `width:${STATE.colWidths[col.key]}px` : '';
    const icon = STATE.sortField===col.key ? (STATE.sortDir==='desc'?'▼':'▲') : '▲';
    const iconOp = STATE.sortField===col.key ? 1 : 0.3;
    return `<th style="${w}" onclick="sortBy('${col.key}')">
      ${esc(col.label)}<span style="opacity:${iconOp};margin-left:4px;font-size:10px">${icon}</span>
      <span class="rh-handle" onmousedown="startResize(event,'${col.key}')"></span>

  const rows = filtered.map((a,ri) => {
    const cells = activeCols.map(col => renderCell(a, col.key)).join('');
    const cbs = STATE.checkLabels.map((_,idx) => {
      const checked = !!STATE.checks[`${a.id}-${idx}`];
      return `<div style="display:flex;flex-direction:column;align-items:center;min-width:70px">

      <td style="max-width:none"><div style="display:flex;gap:6px">

  el.innerHTML = `

    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;padding-bottom:16px;border-bottom:2px solid var(--border2)">

function renderCell(a, key) {
  const w = STATE.colWidths[key] ? `max-width:${STATE.colWidths[key]}px` : 'max-width:200px';
  switch(key) {
    case 'nominativo':
      return `<td style="${w}"><div style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.nominativo)}</div><div style="font-size:10px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;margin-top:1px">${esc(a.email||'')}</div></td>`;
    case 'email':
      return `<td style="${w};color:var(--text-sub);font-size:12px">${esc(a.email||'—')}</td>`;
    case 'reparto':
      return `<td style="${w}"><span class="tag">${esc(a.reparto||'—')}</span></td>`;
    case 'serialePC':
      return `<td style="${w};font-weight:500;color:var(--link)">${esc(a.serialePC||'—')}</td>`;
    case 'modelloPC': {
      const hwPc = STATE.hardware.find(h=>h.tipo==='PC'&&h.assegnatoA&&h.assegnatoA.toLowerCase()===a.nominativo.toLowerCase());
      return hwPc
        ? `<td style="${w};font-size:12px"><span onclick="openEditHw(${hwPc.id})" style="color:var(--link);cursor:pointer;text-decoration:underline;text-decoration-style:dotted">${esc(hwPc.modello||'—')}</span></td>`
        : `<td style="${w};font-size:12px;color:var(--text-muted)">—</td>`;
    }
    case 'dataAcquisto': return `<td style="${w};color:var(--text-sub);font-size:12px">${fmtDate(a.dataAcquisto)}</td>`;
    case 'dataConsegna': return `<td style="${w};color:var(--text-sub);font-size:12px">${fmtDate(a.dataConsegna)}</td>`;
    case 'numeroCellulare': return `<td style="${w}">${esc(a.numeroCellulare||'—')}</td>`;
    case 'sim':  return `<td style="${w};color:var(--text-sub);font-size:12px">${esc(a.sim||'—')}</td>`;
    case 'accountMicrosoft': return `<td style="${w};color:var(--text-sub);font-size:12px">${esc(a.accountMicrosoft||'—')}</td>`;
    case 'note': return `<td style="${w};color:var(--text-sub);font-size:12px">${esc(a.note||'—')}</td>`;
    case 'stato': {
      const c=statoColor(a.stato);
      return `<td style="${w}"><span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${a.stato}</span></td>`;
    }
    case 'hardware': {
      const TI = {PC:'🖥',Monitor:'🖥',Telefono:'📱',SIM:'📡',Cuffie:'🎧',Altro:'📦'};
      const ass = STATE.hardware.filter(h=>h.assegnatoA&&h.assegnatoA.toLowerCase()===a.nominativo.toLowerCase());
      return ass.length===0
        ? `<td style="${w};font-size:12px;color:var(--text-muted)">—</td>`
        : `<td style="${w}"><div style="display:flex;flex-wrap:wrap;gap:4px">${ass.map(h=>`<span onclick="openEditHw(${h.id})" title="${esc(h.modello)} · ${esc(h.seriale)}" style="display:inline-flex;align-items:center;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;color:var(--link);white-space:nowrap;cursor:pointer">${TI[h.tipo]||'📦'} ${esc(h.tipo)}</span>`).join('')}</div></td>`;
    }
    default: return `<td style="${w};color:var(--text-sub);font-size:12px">${esc(a[key]||'—')}</td>`;
  }
}

async function saveForm() {
  if (!FORM.nominativo) { showToast('Nominativo obbligatorio','error'); return; }
  const clean = v => v===''?null:v;
  const payload = {
    nominativo: FORM.nominativo,
    email:      clean(FORM.email||''),
    reparto:    clean(FORM.reparto||''),
    serialePC:  clean(FORM.serialePC||''),
    modelloPC:  clean(FORM.modelloPC||''),
    dataAcquisto: clean(FORM.dataAcquisto||''),
    dataConsegna: clean(FORM.dataConsegna||''),
    numeroCellulare: clean(FORM.numeroCellulare||''),
    accountMicrosoft: clean(FORM.accountMicrosoft||''),
    note:  clean(FORM.note||''),
    stato: FORM.stato||'Attivo',
  };
  try {
    if (STATE.editId) {
      const before = STATE.assets.find(a=>a.id===STATE.editId);
      const changes = diffAssets(before, {...FORM, id:STATE.editId});
      const updated = await PUT('/api/assets/'+STATE.editId, payload);
      STATE.assets = STATE.assets.map(a=>a.id===STATE.editId?updated:a);
      await ensureHardwareFromAsset(updated.nominativo, updated.modelloPC, updated.serialePC);
      await addHistory('MODIFICATO', updated, changes);
      showToast('Asset aggiornato!');
    } else {
      const created = await POST('/api/assets', payload);
      STATE.assets.push(created);
      await ensureHardwareFromAsset(created.nominativo, created.modelloPC, created.serialePC);
      await addHistory('CREATO', created, null);
      showToast('Nuovo asset aggiunto!');
    }
    STATE.view = STATE.prevView;
    render();
  } catch(e) { showToast('Errore: '+e.message,'error'); }
}

async function addHistory(action, asset, changes) {
  const entry = {
    ts:           new Date().toISOString(),
    action,
    asset_id:     asset?.id         ?? null,
    asset_serial: asset?.serialePC  ?? null,
    asset_nome:   asset?.nominativo ?? null,
    changes:      changes           ?? null,
  };
  try {
    await POST('/api/history', entry);
    const hi = await GET('/api/history');
    if (hi) STATE.history = hi;
  } catch(e) { showToast('Errore storico: '+e.message,'error'); }
}
function actionBadge(action) {
  const MAP = {CREATO:['#22c55e','✦'],MODIFICATO:['#f59e0b','✎'],ELIMINATO:['#ef4444','✕'],IMPORTAZIONE:['#1f6feb','⬆'],IMPORTAZIONE_COMPLETA:['#8b5cf6','⬆']};
  const [color,icon] = MAP[action]||['#888','·'];
  return `<span style="display:inline-flex;align-items:center;gap:4px;background:${color}22;color:${color};border:1px solid ${color}44;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:500;white-space:nowrap">${icon} ${action.replace(/_/g,' ')}</span>`;
}

    ? STATE.history.filter(h=>(h.asset_nome||'').toLowerCase().includes(q)||(h.asset_serial||'').toLowerCase().includes(q)||h.action.toLowerCase().includes(q))

  const rows = filtered.map((h,i)=>{

      </div>

    </div>`;
  }).join('') || `<div style="padding:48px 0;text-align:center;color:var(--text-muted)">Nessun evento trovato</div>`;

  el.innerHTML = `

    </div>
    <div class="card">${rows}</div>`;

async function saveHwForm() {
  if (!HWFORM.tipo||!HWFORM.seriale) { showToast('Tipo e Seriale obbligatori','error'); return; }
  if (STATE.hardware.some(h=>h.seriale===HWFORM.seriale&&h.id!==STATE.hwEditId)) { showToast('Seriale duplicato','error'); return; }
  const payload = {...HWFORM};
  try {
    let data;
    if (STATE.hwEditId) {
      data = await PUT('/api/hardware/'+STATE.hwEditId, payload);
      STATE.hardware = STATE.hardware.map(h=>h.id===STATE.hwEditId?data:h);
      // sync asset if assigned
      if (data.assegnatoA) {
        const syncAsset = {...(data.tipo==='PC'?{serialePC:data.seriale,modelloPC:data.modello}:{}),dataAcquisto:data.dataAcquisto||'',dataConsegna:data.dataConsegna||''};
        await PUT('/api/assets/'+STATE.assets.find(a=>a.nominativo===data.assegnatoA)?.id, {...STATE.assets.find(a=>a.nominativo===data.assegnatoA),...syncAsset});
        STATE.assets = STATE.assets.map(a=>a.nominativo===data.assegnatoA?{...a,...syncAsset}:a);
      }
      const old = STATE.hardware.find(h=>h.id===STATE.hwEditId);
      if (old?.assegnatoA&&old.assegnatoA!==data.assegnatoA) {
        const clearAsset = {...(old.tipo==='PC'?{serialePC:'',modelloPC:''}:{}),dataAcquisto:'',dataConsegna:''};
        const oldAsset = STATE.assets.find(a=>a.nominativo===old.assegnatoA);
        if (oldAsset) { await PUT('/api/assets/'+oldAsset.id, {...oldAsset,...clearAsset}); STATE.assets=STATE.assets.map(a=>a.nominativo===old.assegnatoA?{...a,...clearAsset}:a); }
      }
      showToast('Hardware aggiornato!');
    } else {
      data = await POST('/api/hardware', payload);
      STATE.hardware.push(data);
      if (data.assegnatoA) {
        const syncAsset = {...(data.tipo==='PC'?{serialePC:data.seriale,modelloPC:data.modello}:{}),dataAcquisto:data.dataAcquisto||'',dataConsegna:data.dataConsegna||''};
        const ta = STATE.assets.find(a=>a.nominativo===data.assegnatoA);
        if (ta) { await PUT('/api/assets/'+ta.id, {...ta,...syncAsset}); STATE.assets=STATE.assets.map(a=>a.nominativo===data.assegnatoA?{...a,...syncAsset}:a); }
      }
      showToast('Hardware aggiunto!');
    }
    const hw = await GET('/api/hardware');
    if (hw) STATE.hardware=hw;
    STATE.hwEditId=null; STATE._hwSubView='table'; HWFORM=emptyHwForm();
    render();
  } catch(e) { showToast('Errore: '+e.message,'error'); }
}

// HARDWARE AUTO-SYNC FROM ASSET
// ════════════════════════════════════════════════
async function ensureHardwareFromAsset(nominativo, modelloPC, serialePC) {
  if (!nominativo||!modelloPC) return;
  const hw = STATE.hardware.find(h=>h.tipo==='PC'&&h.assegnatoA&&h.assegnatoA.toLowerCase()===nominativo.toLowerCase());
  if (hw) {
    const updated = await PUT('/api/hardware/'+hw.id, {...hw,modello:modelloPC});
    if (updated) STATE.hardware=STATE.hardware.map(h=>h.id===hw.id?updated:h);
  } else {
    const newHw = {tipo:'PC',modello:modelloPC,seriale:serialePC||'',stato:'In uso',assegnatoA:nominativo,note:''};
    const created = await POST('/api/hardware', newHw);
    if (created) STATE.hardware.push(created);
  }
}

    + (clickCb ? ' onclick="event.stopPropagation();' + clickCb + '"' : '')

}

function toggleCol(key) {
  if (STATE.visibleCols.includes(key)) STATE.visibleCols = STATE.visibleCols.filter(k=>k!==key);
  else STATE.visibleCols.push(key);
  render();
}
function dropCol(toKey) {
  const fromKey = STATE.dragCol;
  if (!fromKey || fromKey===toKey) return;
  const arr = [...STATE.colOrder];
  const fi = arr.indexOf(fromKey);
  const ti = arr.indexOf(toKey);
  arr.splice(fi,1); arr.splice(ti,0,fromKey);
  STATE.colOrder = arr;
  render();
}
function resetCols() {
  STATE.visibleCols = ['nominativo','reparto','serialePC','modelloPC','numeroCellulare','dataConsegna','stato','hardware'];
  STATE.colOrder    = ALL_COLS.map(c=>c.key);
  render();
}

// COLUMN RESIZE
// ════════════════════════════════════════════════
let _resizeCol=null, _resizeStartX=0, _resizeStartW=0;
function startResize(e, key) {
  e.preventDefault(); e.stopPropagation();
  _resizeCol    = key;
  _resizeStartX = e.clientX;
  const th = e.currentTarget.parentElement;
  _resizeStartW = STATE.colWidths[key] || th.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  const onMove = ev => { const nw=Math.max(60,_resizeStartW+(ev.clientX-_resizeStartX)); STATE.colWidths[_resizeCol]=nw; render(); };
  const onUp   = () => { _resizeCol=null; document.body.style.cursor=''; document.body.style.userSelect=''; window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onUp);
}

function sortBy(f) {

function diffAssets(before, after) {
  return CSV_COLUMNS.filter(k=>(before[k]||'')!==(after[k]||'')).map(k=>({field:k,from:before[k]||'',to:after[k]||''}));
}

function toCSV(data) {
  const rows = [CSV_HEADERS.join(',')];
  data.forEach(a => rows.push(CSV_COLUMNS.map(k=>`"${(a[k]||'').replace(/"/g,'""')}"`).join(',')));
  return rows.join('\n');
}
function downloadFile(content, name, mime) {
  const blob = new Blob([content],{type:mime});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}
async function loadXLSX() {
  if (window.XLSX) return window.XLSX;
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('Impossibile caricare SheetJS'));
    document.head.appendChild(s);
  });
}
async function exportXLS() {
  const XLSX = await loadXLSX();
  const filtered = getFiltered();
  const rows = [CSV_HEADERS, ...filtered.map(a=>CSV_COLUMNS.map(k=>a[k]||''))];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = CSV_HEADERS.map((h,i)=>({wch:Math.min(Math.max(h.length,...filtered.map(a=>String(a[CSV_COLUMNS[i]]||'').length))+2,40)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Asset');
  XLSX.writeFile(wb,'asset-export.xlsx');
  showToast(`Excel esportato (${filtered.length} record)`);
}

async function parseXLSX(file) {
  const XLSX = await loadXLSX();
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer,{type:'array',cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  if (rows.length<2) return {records:[],errors:['File vuoto o senza dati']};
  const normalize = s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
  const header = rows[0].map(normalize);
  const colMap = {};
  CSV_COLUMNS.forEach((col,i)=>{
    [col.toLowerCase(),CSV_HEADERS[i].toLowerCase(),normalize(CSV_HEADERS[i])].forEach(alias=>{
      const idx=header.indexOf(alias);
      if(idx!==-1&&colMap[col]===undefined) colMap[col]=idx;
    });
  });
  if(Object.keys(colMap).length===0) return {records:[],errors:[`Nessuna colonna riconosciuta. Intestazioni: ${header.slice(0,6).join(', ')}`]};
  const records=[], errors=[];
  rows.slice(1).forEach((row,li)=>{
    if(row.every(c=>String(c).trim()==='')) return;
    const rec={...emptyForm()};
    CSV_COLUMNS.forEach(col=>{
      if(colMap[col]!==undefined){const val=row[colMap[col]];rec[col]=val instanceof Date?val.toISOString().slice(0,10):String(val??'').trim();}
    });
    if(!rec.nominativo){errors.push(`Riga ${li+2}: "Nominativo" mancante`);return;}
    if(!STATI.includes(rec.stato)) rec.stato='Attivo';
    records.push(rec);
  });
  return {records,errors};
}

async function dlTemplate() {
  const XLSX = await loadXLSX();
  const ws = XLSX.utils.aoa_to_sheet([CSV_HEADERS, CSV_COLUMNS.map(()=>'')]);
  ws['!cols'] = CSV_HEADERS.map(h=>({wch:Math.max(h.length+4,16)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Asset');
  XLSX.writeFile(wb,'template-import.xlsx');
}

async function handleImportFile(e) {
  const f = e.target.files[0]; if (!f) return; e.target.value='';
  try { STATE.importData = await parseXLSX(f); render(); }
  catch(err) { STATE.importData={records:[],errors:['Errore: '+err.message]}; render(); }
}

async function confirmImport() {
  const importData = STATE.importData;
  if (!importData||!importData.records.length) return;
  try {
    if (STATE.importMode==='sostituisci') { await DELETE('/api/assets/all'); STATE.assets=[]; }
    let inserted=0, updated=0;
    const clean = v=>v===''?null:v;
    for (const rec of importData.records) {
      const payload = {nominativo:rec.nominativo,email:clean(rec.email),reparto:clean(rec.reparto),serialePC:clean(rec.serialePC),modelloPC:clean(rec.modelloPC),dataAcquisto:clean(rec.dataAcquisto),dataConsegna:clean(rec.dataConsegna),numeroCellulare:clean(rec.numeroCellulare),accountMicrosoft:clean(rec.accountMicrosoft),note:clean(rec.note),stato:rec.stato};
      const existing = STATE.assets.find(a=>a.nominativo===rec.nominativo);
      if (existing) { const upd=await PUT('/api/assets/'+existing.id,payload); STATE.assets=STATE.assets.map(a=>a.id===existing.id?upd:a); updated++; }
      else          { const cre=await POST('/api/assets',payload); STATE.assets.push(cre); inserted++; }
      if (rec.modelloPC) await ensureHardwareFromAsset(rec.nominativo,rec.modelloPC,rec.serialePC);
    }
    const hw = await GET('/api/hardware'); if(hw) STATE.hardware=hw;
    const total = inserted+updated;
    await addHistory(STATE.importMode==='sostituisci'?'IMPORTAZIONE_COMPLETA':'IMPORTAZIONE', {nominativo:`${total} asset`,serialePC:null,id:null}, null);
    showToast(`${total} asset importati! (${updated} aggiornati, ${inserted} nuovi)`);
    STATE.importData=null; STATE.view='table'; render();
  } catch(e) { showToast('Errore importazione: '+e.message,'error'); }
}

let _userEditId = null;
let _userDeleteId = null;

function renderUsers(el) {
  const RUOLI = ['admin','editor','viewer'];

function openEditUser(id) {
  const u = STATE.users.find(x=>x.id===id);
  if (!u) return;
  _userEditId = id;
  _userForm = {nome:u.nome, email:u.email, password:'', ruolo:u.ruolo, attivo:!!u.attivo};
  render();
}

async function saveUser() {
  if (!_userForm.nome||!_userForm.email) { showToast('Nome ed email obbligatori','error'); return; }
  if (!_userEditId && !_userForm.password) { showToast('Password obbligatoria per nuovo utente','error'); return; }
  try {
    if (_userEditId) {
      const data = await PUT('/api/users/'+_userEditId, _userForm);
      STATE.users = STATE.users.map(u=>u.id===_userEditId?data:u);
      showToast('Utente aggiornato!');
    } else {
      const data = await POST('/api/users', _userForm);
      STATE.users.push(data);
      showToast('Utente aggiunto!');
    }
    _userEditId=null; _userForm={nome:'',email:'',password:'',ruolo:'viewer',attivo:true};
    render();
  } catch(e) { showToast('Errore: '+e.message,'error'); }
}

function confirmDeleteUser(id) {
  _userDeleteId = id;
  document.getElementById('modal-delete-user-confirm').onclick = doDeleteUser;
  openModal('modal-delete-user');
}

async function doDeleteUser() {
  closeModal('modal-delete-user');
  try {
    await DELETE('/api/users/'+_userDeleteId);
    STATE.users = STATE.users.filter(u=>u.id!==_userDeleteId);
    showToast('Utente eliminato','info');
    render();
  } catch(e) { showToast('Errore: '+e.message,'error'); }
}
